<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#E6D8BF">
    <title>PF1 Spellbook</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234E5D2B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z'/%3E%3Cpath d='M4 19a2 2 0 0 1 2-2h13'/%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #E6D8BF; }
        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            font-family: Georgia, serif; color: #4E5D2B;
            background: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(78,93,43,.13) 27px 28px), #E6D8BF;
        }
        #loading .title { font-size: 32px; font-style: italic; font-weight: bold; }
        #loading .hint { font-family: system-ui, sans-serif; font-size: 14px; color: #5E4D38; }
    </style>
    <!--UMAMI-->
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="loading">
    <div class="title">PF1 Spellbook</div>
    <div class="hint">Loading… (needs a recent browser: Chrome/Edge 119+, Firefox 120+, Safari 18.2+)</div>
</div>
</body>
</html>
