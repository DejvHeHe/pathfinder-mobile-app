# Vydání verze: sestaví všechny buildy a přiloží je k GitHub Release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Výstup (Releases na stránce repa):
#   PF-Spellbook-<verze>.apk               Android
#   PF-Spellbook-<verze>.msi / .dmg / .deb  Windows / macOS / Linux instalátory (obsahují vlastní Javu)
#   PF-Spellbook-<verze>-web.zip           statický web (rozbalit na hosting)
# a Docker image ghcr.io/<owner>/pf-spellbook-web:<verze> + :latest.
#
# Ruční spuštění (Actions → Release → Run workflow) jen sestaví buildy jako artefakty, Release nevytvoří.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Verze (např. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore ze secrets (volitelné)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          V="${VERSION#v}"
          ./gradlew :composeApp:assembleRelease -PappVersion="$V" -PversionCode=${{ github.run_number }} --console=plain
          mkdir -p out && cp composeApp/build/outputs/apk/release/*.apk "out/PF-Spellbook-$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, ext: msi }
          - { os: macos-latest, ext: dmg }
          - { os: ubuntu-latest, ext: deb }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          V="${VERSION#v}"
          ./gradlew :composeApp:packageDistributionForCurrentOS -PappVersion="$V" --console=plain
          mkdir -p out
          f=$(find composeApp/build/compose/binaries/main/${{ matrix.ext }} -name "*.${{ matrix.ext }}" | head -1)
          cp "$f" "out/PF-Spellbook-$V.${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.ext }}
          path: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web
        run: |
          chmod +x gradlew
          V="${VERSION#v}"
          ./gradlew :composeApp:wasmJsBrowserDistribution -PappVersion="$V" --console=plain
          mkdir -p out
          (cd composeApp/build/dist/wasmJs/productionExecutable && zip -qr "$GITHUB_WORKSPACE/out/PF-Spellbook-$V-web.zip" . -x '*.map')
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/* }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pf-spellbook-web" >> "$GITHUB_ENV"
          echo "V=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          build-args: APP_VERSION=${{ env.V }}
          tags: |
            ${{ env.IMAGE }}:${{ env.V }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [android, desktop, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: PF1 Spellbook ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Stažení
            | Platforma | Soubor |
            |---|---|
            | Android | `.apk` – povolit instalaci z neznámých zdrojů |
            | Windows | `.msi` |
            | macOS | `.dmg` – nepodepsané: první spuštění přes pravé tlačítko → Otevřít |
            | Linux | `.deb` (`sudo apt install ./PF-Spellbook-*.deb`) |
            | Web | `-web.zip` na statický hosting, nebo Docker `ghcr.io/${{ github.repository_owner }}/pf-spellbook-web` |
