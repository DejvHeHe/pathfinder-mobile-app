# Kontrola každého pushe / pull requestu: testy, Android, web a iOS (Kotlin část).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, Android, Web
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:desktopTest :composeApp:assembleDebug :composeApp:wasmJsBrowserDistribution --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: composeApp/build/test-results/desktopTest/
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS framework (simulator)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain
