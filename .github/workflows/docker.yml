# Docker image webové verze → GitHub Container Registry (ghcr.io/<owner>/pf-spellbook-web).
# Sestavuje se tady na GitHubu, aby server nemusel nic kompilovat (build potřebuje ~4 GB RAM a několik jader).
#
#   push do main         → :edge   (vždy nejnovější kód)
#   tag v1.2.3           → :1.2.3 a :latest
#   ruční spuštění       → :edge
#
# Na serveru:  docker compose pull && docker compose up -d     (TAG=edge pro nejnovější main)

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**", "iosApp/**", ".github/workflows/ci.yml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tagy image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pf-spellbook-web"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "TAGS=$IMAGE:$V,$IMAGE:latest" >> "$GITHUB_ENV"
          else
            V="1.0.0"
            echo "TAGS=$IMAGE:edge" >> "$GITHUB_ENV"
          fi
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: APP_VERSION=${{ env.V }}
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
