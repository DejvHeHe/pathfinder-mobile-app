# Ukázka pro VLASTNÍ nginx na hostiteli (ne pro kontejner). Upravte doménu a cesty k certifikátům.
# Vyberte jednu variantu: A (proxy na kontejner) nebo B (statické soubory přímo).

server {
    listen 443 ssl;
    http2 on;
    server_name spellbook.example.com;

    ssl_certificate     /etc/letsencrypt/live/spellbook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spellbook.example.com/privkey.pem;

    # ---------- A) proxy na Docker kontejner (compose.yaml, 127.0.0.1:8888) ----------
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # kontejner už posílá gzip a cache hlavičky – nic dalšího není potřeba
    }

    # ---------- B) bez kontejneru: soubory z `docker build --target export --output type=local,dest=./web-dist .` ----------
    # (nebo rozbalený PF-Spellbook-<verze>-web.zip z GitHub Release)
    #
    # root /srv/pf-spellbook/web-dist;
    # index index.html;
    # gzip on;
    # gzip_types application/wasm application/javascript application/json text/csv text/plain font/ttf;
    # location = /index.html { add_header Cache-Control "no-cache"; }
    # location / { try_files $uri $uri/ /index.html; }
    # # .wasm musí mít typ application/wasm – standardní mime.types nginx ≥ 1.21 ho obsahuje
}

# Webová appka může běžet i v podsložce (např. https://example.com/spellbook/) – všechny cesty v buildu jsou relativní:
#   location /spellbook/ { proxy_pass http://127.0.0.1:8888/; }
