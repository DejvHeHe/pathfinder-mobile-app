# nginx pro webovou verzi PF1 Spellbook (statické soubory Kotlin/Wasm buildu)
# (typ application/wasm pro .wasm zná nginx ≥ 1.21 ze svého mime.types)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # komprese – .wasm (~12 MB) a data (JSON/CSV) se zmenší zhruba na třetinu
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript application/json text/csv text/plain text/css image/svg+xml font/ttf application/x-font-ttf application/octet-stream;

    # index.html vždy čerstvý (odkazuje na nové verze buildu)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # wasm, js a přibalená data (JSON/CSV, fonty) nemají v názvu hash – mění se s buildem pod stejným jménem.
    # no-cache = prohlížeč si je drží, ale před použitím se zeptá serveru (ETag / Last-Modified):
    # beze změny 304 bez stahování, po nové verzi hned nový soubor (žádná hodina se starou appkou, žádný Ctrl+F5)
    # a nehrozí ani mix nového .wasm se starými daty.
    location ~* \.(wasm|js|map)$ {
        add_header Cache-Control "no-cache";
    }

    location /composeResources/ {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
