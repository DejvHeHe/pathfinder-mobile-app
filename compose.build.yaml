# Volitelné: sestavení image přímo na tomto stroji místo stažení z GitHubu.
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Pozor: kompilace do WebAssembly potřebuje ~4 GB RAM a několik jader a trvá 10+ minut.
# Na malé VPS může server přestat odpovídat – tam použijte hotový image (docker compose pull).

services:
  web:
    image: pf-spellbook-web:local
    pull_policy: build
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
